name: Publish admin test site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_BASE_PATH: /FMS/
      VITE_STAFF_BASE_PATH: /FMS/staff/
      VITE_CUSTOMER_BASE_PATH: /FMS/customer/
      VITE_PLATFORM_BASE_PATH: /FMS/platform/
      VITE_ROUTER_MODE: hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.live.example .env.production.local
      - run: npm run check
      # The staff portal is published beside the admin app at /FMS/staff/.
      - run: cp -r apps/staff-web/dist apps/admin-web/dist/staff
      # Phase 7: the customer portal is published at /FMS/customer/.
      - run: cp -r apps/customer-web/dist apps/admin-web/dist/customer
      # Phase 8: the Sharaco platform console is published at /FMS/platform/.
      - run: cp -r apps/platform-web/dist apps/admin-web/dist/platform
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/admin-web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy test site
        id: deployment
        uses: actions/deploy-pages@v4
