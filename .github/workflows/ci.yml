name: FacilityOS checks
on:
  push:
    branches:
      [
        main,
        feature/phase0-foundation,
        feature/phase1-company-sites,
        feature/phase1-site-contract-decoupling,
        feature/phase2-people-assets-inventory,
      ]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:rules
      - run: npm run test:migration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: docs/evidence/
          if-no-files-found: ignore
# This workflow validates only. Production Pages deployment remains tied to main.
