name: FacilityOS checks
on:
  push:
    branches:
      [
        main,
        feature/phase0-foundation,
        feature/phase1-company-sites,
        feature/phase1-site-contract-decoupling,
        feature/phase2-people-assets-inventory,
        feature/phase3-tasks-raci-approvals,
        feature/phase4-scheduling-maintenance,
        feature/phase5-staff-web,
        feature/phase6-mobile-apps,
        feature/phase9-help-documentation,
      ]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run format:check
      # Phase 9: documentation must match the apps (links, ids, screenshots, routes, coverage).
      - run: npm run help:check
      - run: npm run check
      - run: npm run test:rules
      - run: npm run test:migration
      - run: npx playwright install --with-deps chromium
      # pdftotext/pdfinfo: the PDF generator verifies contents-page numbers with them.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm run test:browser
      - run: npm run test:staff-browser
      - run: npm run test:phase7-browser
      - run: npm run test:phase8-browser
      - run: npm run test:mobile-runtime
      # Phase 9: PDF manuals + Help Center site, then its browser test.
      - run: npm run help:pdf
      - run: npm run help:build
      - run: npm run test:help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/evidence/
            apps/help-web/pdf/
          if-no-files-found: ignore
# This workflow validates only. Production Pages deployment remains tied to main.
