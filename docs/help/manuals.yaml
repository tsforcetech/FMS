# PDF manuals. Each is generated from the same articles as the Help Center by
# `npm run help:pdf`. A section lists `modules` (all articles of that module the
# manual's audience may see, in site.yaml `order`), explicit `articles`, and/or
# `diagrams` (ids, or `all`). Public manuals are published on the Help Center;
# restricted ones (authenticated/internal) are written to docs/help/.restricted/
# only and are never part of the public website.
manuals:
  - id: complete
    title: FacilityOS Complete System Manual
    subtitle: Every module of the administration, staff, mobile and customer applications
    audience: public
    file: FacilityOS-Complete-System-Manual.pdf
    sections:
      - { title: Getting started, modules: [Getting Started] }
      - { title: Company setup, modules: [Company Setup] }
      - { title: Sites and locations, modules: [Sites & Locations] }
      - { title: Clients and contracts, modules: [Clients & Contracts] }
      - { title: Employees and teams, modules: [Employees & Teams] }
      - { title: Assets and inventory, modules: [Assets & Inventory] }
      - { title: Task management, modules: [Task Management] }
      - { title: Task templates, modules: [Task Templates] }
      - { title: Recurring scheduling, modules: [Recurring Scheduling] }
      - { title: Task calendar, modules: [Task Calendar] }
      - {
          title: Maintenance and work orders,
          modules: [Maintenance & Work Orders],
        }
      - {
          title: Complaints and escalations,
          modules: [Complaints & Escalations],
        }
      - { title: Staff web portal, modules: [Staff Web] }
      - { title: Mobile application, modules: [Mobile Application] }
      - { title: Customer portal, modules: [Customer Portal] }
      - { title: Reports and analytics, modules: [Reports & Analytics] }
      - { title: Excel and PDF exports, modules: [Excel & PDF Exports] }
      - { title: Bulk import, modules: [Bulk Import] }
      - {
          title: Plans and subscriptions,
          modules: [SaaS Plans & Subscriptions],
        }
      - { title: Role guides, modules: [Role Guides] }
      - { title: Troubleshooting, modules: [Troubleshooting] }
      - { title: Frequently asked questions, modules: [FAQs] }
      - { title: Reference, modules: [Reference] }

  - id: administrator
    title: FacilityOS Administrator Manual
    subtitle: For company owners, administrators and facility managers using the admin web application
    audience: public
    file: FacilityOS-Administrator-Manual.pdf
    sections:
      - { title: Getting started, modules: [Getting Started] }
      - { title: Company setup, modules: [Company Setup] }
      - { title: Sites and locations, modules: [Sites & Locations] }
      - { title: Clients and contracts, modules: [Clients & Contracts] }
      - { title: Employees and teams, modules: [Employees & Teams] }
      - { title: Assets and inventory, modules: [Assets & Inventory] }
      - { title: Task management, modules: [Task Management] }
      - { title: Task templates, modules: [Task Templates] }
      - { title: Recurring scheduling, modules: [Recurring Scheduling] }
      - { title: Task calendar, modules: [Task Calendar] }
      - {
          title: Maintenance and work orders,
          modules: [Maintenance & Work Orders],
        }
      - {
          title: Complaints and escalations,
          modules: [Complaints & Escalations],
        }
      - { title: Reports and analytics, modules: [Reports & Analytics] }
      - { title: Excel and PDF exports, modules: [Excel & PDF Exports] }
      - { title: Bulk import, modules: [Bulk Import] }
      - {
          title: Plans and subscriptions,
          modules: [SaaS Plans & Subscriptions],
        }
      - title: Administrator role guides
        articles: [role.owner-admin, role.facility-manager, role.site-manager]
      - title: Troubleshooting
        articles:
          [
            ts.not-linked,
            ts.access-denied,
            ts.no-tasks,
            ts.no-eligible-staff,
