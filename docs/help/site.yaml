  gettingStarted: [gs.first-week, setup.wizard, sites.create, people.employees, templates.builder, train.first-task]
  workflows: [wf-02, wf-25, wf-27, wf-32, wf-41, wf-45]

whatsNew:
  - { version: '0.8', date: '2026-11-15', text: Excel and PDF export on every list and report, Import Center, company setup wizard with starter packs, plans and subscriptions, invitations and the Sharaco platform console., articles: [exports.overview, import.overview, setup.wizard, saas.plan-usage, setup.invitations] }
  - { version: '0.7', date: '2026-11-15', text: Reports & analytics, management dashboard, customer portal, compliance records, maintenance costs, audit history and backup status., articles: [reports.dashboard, customer.requests, reports.compliance] }
  - { version: '0.6', date: '2026-11-15', text: Android/iOS mobile app with QR scanning, photos, GPS, attendance and offline work., articles: [mobile.install, mobile.offline] }
  - { version: '0.5', date: '2026-11-14', text: Staff web portal for day-to-day work., articles: [staff.my-day] }

